  <ellipse cx="238" cy="219" rx="40" ry="12" fill="#E7DAC2"/>
  <path d="M206 220c14 8 47 9 65 0" stroke="#F8F8F4" stroke-opacity=".64" stroke-linecap="round"/>
  <path d="m224 213 17-4 14 6-18 4Z" fill="#6753AD"/>
  <path d="m225 212 16-4 14 5-18 4Z" fill="#BBAADD"/>
  <path d="m250 196 10 0-1 13c0 3-8 3-8 0Z" fill="#F8F8F4" fill-opacity=".65" stroke="#8E9E97" stroke-opacity=".5"/>
  <path d="m252 204 6 0" stroke="#91ADAB" stroke-opacity=".6"/>
</svg>
