  <path d="m130 248-5 29m66-32 6 28" stroke="#53435E" stroke-width="5" stroke-linecap="round"/>
  <path d="M119 227c-7-14-12-53-7-77 3-15 16-23 29-20l42 10c17 4 20 21 16 37l-8 47Z" fill="url(#lilac-upholstery)"/>
  <path d="M119 227c-7-14-12-53-7-77 3-15 16-23 29-20l42 10c17 4 20 21 16 37l-8 47Z" fill="url(#woven)"/>
  <path d="M124 155c-1-9 5-14 14-12l38 9c8 2 12 7 10 17l-8 35-43-10Z" fill="#C8BAE5"/>
