  <path d="m68 222 46 0-6 37c-1 9-32 9-34 0Z" fill="#E7DAC2"/>
  <ellipse cx="91" cy="222" rx="23" ry="5" fill="#CBBBA0"/>
  <path d="m80 231 3 24m9-23v26m11-26-3 24" stroke="#F8F8F4" stroke-opacity=".66" stroke-width="2" stroke-linecap="round"/>

