  <path d="M265 223c17-12 55-20 76-15 10 3 15 10 9 16-14 11-56 18-77 11-8-2-13-6-8-12Z" fill="#AEC5B4"/>
  <path d="M345 187c8-8 20-3 20 8l-1 41c0 13-10 22-19 17-7-4-9-11-5-21l2-29c0-8 0-13 3-16Z" fill="#86A694"/>
  <path d="m352 197-2 34" stroke="#D4DFD2" stroke-width="2" stroke-linecap="round"/>
  <path d="M277 188c-7-4-14 1-15 9l-9 36c-3 11 5 18 12 13 5-3 6-9 8-20Z" fill="#688E7D"/>

