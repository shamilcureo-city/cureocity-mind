<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" fill="none" role="img" aria-labelledby="room-title room-desc">
  <title id="room-title">Room for a conversation</title>
  <desc id="room-desc">Two softly sculpted chairs face a shared table beside a plant and a sunlit arched window.</desc>
  <defs>
    <linearGradient id="daylight" x1="319" y1="38" x2="220" y2="233" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F8F4"/>
      <stop offset="1" stop-color="#E7DAC2" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="lilac-upholstery" x1="130" y1="134" x2="192" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6A5DC"/>
      <stop offset="1" stop-color="#8B76BD"/>
    </linearGradient>
    <linearGradient id="sage-upholstery" x1="355" y1="130" x2="287" y2="259" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B1C4B7"/>
      <stop offset="1" stop-color="#719386"/>
    </linearGradient>
    <pattern id="woven" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M1 1h1M5 4h1" stroke="#F8F8F4" stroke-opacity=".35" stroke-width=".7" stroke-linecap="round"/>
    </pattern>
    <clipPath id="window-cutout"><path d="M229 154V66a48 48 0 0 1 96 0v88Z"/></clipPath>
  </defs>

  <!-- The room is suggested by a single arch and a woven, oval rug. -->
  <path d="M215 161V66a62 62 0 0 1 124 0v95" stroke="#E7DAC2" stroke-width="9"/>
  <path d="M229 154V66a48 48 0 0 1 96 0v88Z" fill="url(#daylight)"/>
  <g clip-path="url(#window-cutout)">
    <circle cx="319" cy="47" r="30" fill="#E7DAC2" opacity=".72"/>
    <path d="M226 141c24-32 37-24 53-45 21-26 42-18 58-30v105H226Z" fill="#D8E1D5" opacity=".55"/>
    <path d="M280 18v140M229 100h97" stroke="#F8F8F4" stroke-width="5"/>
  </g>
  <path d="m278 158 59 0 99 112-212 8Z" fill="#E7DAC2" opacity=".18"/>
  <path d="M210 166h134" stroke="#CDBFA7" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="236" cy="268" rx="197" ry="35" fill="#E7DAC2" opacity=".38"/>
  <ellipse cx="236" cy="267" rx="184" ry="28" stroke="#D6C8B1" stroke-opacity=".75"/>
  <path d="M84 279c48 21 224 26 303-2M94 284c52 17 212 20 282-2" stroke="#D6C8B1" stroke-opacity=".55" stroke-linecap="round"/>

  <!-- A small living plant, placed away from the conversation. -->
  <path d="M91 238c-4-44-9-75 2-120m-3 66-18-33m17 51 22-38m-20-7 14-23" stroke="#506F62" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M94 126c-8-22-2-36 11-46 9 22 4 36-11 46Z" fill="#719386"/>
  <path d="M84 153c-20-3-31-15-33-31 23-2 37 9 33 31Z" fill="#8EAA97"/>
  <path d="M99 149c-1-18 9-29 27-34 1 21-10 32-27 34Z" fill="#A4BCA7"/>
