  <path d="M189 190c5-7 16-5 19 3l13 37c4 12-4 22-12 17-5-3-7-11-9-20Z" fill="#8C74B8"/>

  <!-- Right chair mirrors the invitation, not the exact shape. -->
  <path d="m284 248-6 27m64-29 6 28" stroke="#405B4F" stroke-width="5" stroke-linecap="round"/>
  <path d="M279 222c-3-11-10-48-8-64 1-13 8-21 22-25l34-9c16-4 28 7 30 23l2 73Z" fill="url(#sage-upholstery)"/>
  <path d="M279 222c-3-11-10-48-8-64 1-13 8-21 22-25l34-9c16-4 28 7 30 23l2 73Z" fill="url(#woven)"/>
  <path d="M285 158c-1-7 3-12 10-14l29-8c10-3 16 4 16 12l2 44-47 15Z" fill="#C0D0C1"/>
