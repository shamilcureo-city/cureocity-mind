name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'

jobs:
  static-checks:
    name: Format + Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke production dependency entrypoints
        run: |
          node scripts/release-runtime-preflight.mjs
          node --test scripts/release-runtime-preflight.test.mjs
          pnpm smoke:prod-dependencies

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://x:x@x:5432/x
        run: pnpm db:generate

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://x:x@x:5432/x
        run: pnpm db:validate

      - name: Check migration idempotency
        run: pnpm db:check-migrations

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit + Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cureocity
          POSTGRES_PASSWORD: cureocity
          POSTGRES_DB: cureocity_mind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cureocity -d cureocity_mind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cureocity:cureocity@localhost:5432/cureocity_mind_test
      AUTH_BYPASS: 'true'
      RUN_INTEGRATION_TESTS: '1'
      # scribe-service integration: avoid MinIO / Redis dependencies in CI.
      STORAGE_BACKEND: memory
      NOTE_QUEUE_BACKEND: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      # This one historical migration references Appointment before the table's
      # later creation migration. It is already applied in production and must
      # not be edited; reconcile only this disposable fresh CI database, then a
      # fix-forward migration restores the intended indexes.
      - name: Reconcile historical fresh-database migration ordering
        run: pnpm db:prepare-fresh-ci

      - name: Apply Prisma migrations
        run: pnpm db:migrate:deploy

      - name: Build contracts (dependency of patient-model-service)
        run: pnpm nx run contracts:build

      - name: Run all tests (unit + integration)
        run: pnpm test

      # These suites require PostgreSQL itself to accept on loopback, not a
      # bridge-network address behind a published Docker port. Keep the
      # existing 5432 service for the standard integration suite unchanged.
      - name: Start isolated Mind PostgreSQL
        timeout-minutes: 1
        run: |
          docker run --detach --name cureocity-mind-postgres-ci --network host \
            --env POSTGRES_USER=cureocity --env POSTGRES_PASSWORD=cureocity \
            --env POSTGRES_DB=cureocity_mind_test \
            postgres:16-alpine postgres -p 55439 -c listen_addresses=127.0.0.1
          for attempt in {1..30}; do
            if docker exec cureocity-mind-postgres-ci pg_isready -h 127.0.0.1 -p 55439 -U cureocity -d cureocity_mind_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs cureocity-mind-postgres-ci
          exit 1

      - name: Migrate isolated Mind PostgreSQL
        env:
          DATABASE_URL: postgresql://cureocity:cureocity@127.0.0.1:55439/cureocity_mind_test
        run: |
          pnpm db:prepare-fresh-ci
          pnpm db:migrate:deploy

      - name: Run Mind PostgreSQL persistence tests
        env:
          RUN_MIND_POSTGRES_TESTS: '1'
          MIND_TEST_DATABASE_URL: postgresql://cureocity:cureocity@127.0.0.1:55439/cureocity_mind_test
          DATABASE_URL: postgresql://cureocity:cureocity@127.0.0.1:55439/cureocity_mind_test
        run: |
          pnpm --filter @cureocity/web exec vitest run \
            lib/appointment-reminder-uniqueness-postgres.spec.ts \
            lib/mind-consent-recovery-postgres.spec.ts \
            lib/mind-counselling-postgres.spec.ts \
            --maxWorkers=1

      - name: Stop isolated Mind PostgreSQL
        if: ${{ always() }}
        run: |
          if docker container inspect cureocity-mind-postgres-ci >/dev/null 2>&1; then
            docker rm --force cureocity-mind-postgres-ci
          fi

  # NEXT5 — the gateway ships as a container to Cloud Run, but nothing in CI
  # built that image, so a broken Dockerfile (or a workspace change the image
  # can't install) surfaced only at deploy time in Cloud Build. Build it here
  # (no push) whenever the gateway or its workspace inputs change.
  gateway-image:
    name: Gateway docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect gateway-relevant changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          # If the diff can't be computed, build anyway (fail open, not skip).
          FILES=$(git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null) || {
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          }
          if echo "$FILES" | grep -qE '^(services/live-gateway/|packages/(contracts|llm|clinical)/|pnpm-lock\.yaml|package\.json|cloudbuild\.gateway\.yaml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.changed.outputs.run == 'true'
        run: docker build -f services/live-gateway/Dockerfile -t cureocity-live-gateway:ci .
